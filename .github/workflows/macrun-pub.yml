name: macrun-pub
run-name: "macrun ${{ inputs.script }} [${{ inputs.req }}]"
# NCOM macOS runner lane, PUBLIC variant. This repo holds only this workflow and a README — no dmg, no HF
# token, nothing private. The dmg arrives AES-256 encrypted via a short-lived signed URL (~1h, minted off-box
# from the private HF store) and is decrypted in-runner with the narrow DMG_KEY secret. Only command output
# (e.g. ictool --help text) ever leaves the runner as an artifact.
#
# IMPORTANT: inputs.dmg_url must NEVER be interpolated with ${{ }} directly inside a `run:` script body.
# GitHub prints the fully-substituted script text as the step's "Run ..." log header BEFORE any ::add-mask::
# inside that same script takes effect, so a direct ${{ inputs.dmg_url }} in a run: line leaks the whole URL
# in plain text in this PUBLIC repo's log. The only safe pattern: pass it through `env:` and reference it as
# a shell variable ($URL), then mask that variable as the very first line of the step that uses it.
on:
  workflow_dispatch:
    inputs:
      dmg_url:
        description: "short-lived signed URL of the AES-256 ENCRYPTED dmg (minted by macrun_pub.py; expires ~1 h)"
        required: true
      sha256:
        description: "expected sha256 of the PLAINTEXT dmg (blank = skip check)"
        required: false
        default: ""
      script:
        description: "script in scripts/ (without .sh) run with APP, MNT, OUT set; or 'cmd' to run the cmd input"
        required: true
        default: "ictool"
      cmd:
        description: "shell command when script=cmd (runs with APP, MNT, OUT set)"
        required: false
        default: ""
      req:
        description: "request id (set by macrun_pub.py to find this run)"
        required: false
        default: manual
      runner:
        description: "runner label"
        required: false
        default: "macos-26"
permissions:
  contents: read
jobs:
  run:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Host facts
        run: |
          mkdir -p out
          { sw_vers; uname -a; sysctl -n machdep.cpu.brand_string; xcode-select -p; xcodebuild -version 2>/dev/null | head -2; } 2>&1 | tee out/host.txt
      - name: Fetch + decrypt dmg (ciphertext and key only ever touch this run; never committed, never logged)
        env:
          DMG_KEY: ${{ secrets.DMG_KEY }}
          URL: ${{ inputs.dmg_url }}
          SHA: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          echo "::add-mask::$URL"
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/in.enc" "$URL"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:DMG_KEY -in "$RUNNER_TEMP/in.enc" -out "$RUNNER_TEMP/in.dmg"
          rm -f "$RUNNER_TEMP/in.enc"
          got=$(shasum -a 256 "$RUNNER_TEMP/in.dmg" | cut -d' ' -f1)
          echo "dmg=encrypted-input sha256=$got bytes=$(stat -f%z "$RUNNER_TEMP/in.dmg")" | tee out/dmg.txt
          if [ -n "$SHA" ] && [ "$got" != "$SHA" ]; then echo "sha256 mismatch (want $SHA)"; exit 3; fi
      - name: Mount dmg
        run: |
          set -uo pipefail
          # NOTE (fix, found on a real run): "yes | hdiutil ... | tee" under `set -o pipefail` fails the step
          # with SIGPIPE (141) the instant hdiutil exits and stops reading stdin, even though the mount itself
          # succeeded -- `yes` never gets to finish, pipefail sees its non-zero exit, `-e` would abort the
          # script. Fixed: no infinite pipe into hdiutil (its stdin is just closed; this dmg showed no license
          # prompt in practice), and hdiutil's own exit code is checked explicitly instead of relying on `-e`.
          MNT="$RUNNER_TEMP/dmgmnt"; mkdir -p "$MNT"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$MNT" "$RUNNER_TEMP/in.dmg" < /dev/null > out/mount.txt 2>&1
          rc=$?
          cat out/mount.txt
          if [ "$rc" -ne 0 ]; then echo "hdiutil attach failed, exit=$rc"; exit "$rc"; fi
          APP=$(find "$MNT" -maxdepth 2 -name "*.app" -type d | head -1)
          echo "MNT=$MNT" >> "$GITHUB_ENV"; echo "APP=$APP" >> "$GITHUB_ENV"
          echo "app=$APP" | tee -a out/mount.txt
          [ -n "$APP" ] && /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist" | tee -a out/mount.txt || true
      - name: Run
        env:
          SCRIPT: ${{ inputs.script }}
          CMD: ${{ inputs.cmd }}
        run: |
          set -o pipefail
          export OUT="$GITHUB_WORKSPACE/out"
          case "$SCRIPT" in *[!A-Za-z0-9_-]*) echo "bad script name"; exit 2;; esac
          start=$(date +%s)
          if [ "$SCRIPT" = cmd ]; then bash -c "$CMD" 2>&1 | tee "$OUT/run.log"; rc=$?
          else bash "scripts/$SCRIPT.sh" 2>&1 | tee "$OUT/run.log"; rc=$?; fi
          echo "run_seconds=$(( $(date +%s) - start )) exit=$rc" | tee -a "$OUT/run.log"
          exit $rc
      - name: Unmount
        if: always()
        run: hdiutil detach "$MNT" -force || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macrun-pub-${{ inputs.req }}
          path: out/
          retention-days: 1
